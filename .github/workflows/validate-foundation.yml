name: Validate Agentic Foundation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'agents/**'
      - '.agents/**'
      - '.github/**'
      - 'orchestrator/**'
      - 'schemas/**'
      - 'config/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Compile Python
        run: python -m compileall orchestrator scripts .agents/skills/repository-inventory/scripts
