name: Agent Eval Harness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/**'
      - '.agents/**'
      - 'evals/**'
      - 'AGENTS.md'

jobs:
  structural-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate golden task definitions
        run: python scripts/validate_evals.py
